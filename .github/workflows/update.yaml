name: Daten aktualisieren

on:
  schedule:
    - cron: 40 22 * * 1-5
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - run: pip install -r requirements.txt
      - run: python fetch_data.py
        env:
          SEC_KONTAKT: ${{ secrets.SEC_KONTAKT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
      - name: Ergebnis speichern
        run: |
          git config user.name aktien-radar-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json cusip_map.json
          git diff --staged --quiet || git commit -m Daten-aktualisiert
          git push
